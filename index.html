<!DOCTYPE html>
<html>
    <head>
        <title>The Movie Web Page</title>
        <meta charset="UTF-8" />
        <meta name="author" content="Mike Taslakjian" />
        <meta name="viewport" content="width=device-width initial-scale=1.0" />
        <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro' rel='stylesheet' type='text/css'>
        <link rel="stylesheet" href="Styles/styles.css" />
        <link rel="stylesheet" href="Styles/header.css" />
        <link rel="stylesheet" href="Styles/filters.css" />
        <link rel="stylesheet" href="Styles/cards.css" />
    </head>
    <body>
        <header>
            <nav class="nav-content">
                <nav class="main-nav">
                    <a><img src="assets/header/main-logo.svg" alt="Logo." /></a>
                    <ul>
                        <li><a>Movies</a></li>
                        <li><a>TV Shows</a></li>
                        <li><a>People</a></li>
                        <li><a>More</a></li>
                    </ul>
                </nav>
                <nav class="secondary-nav">
                    <ul>
                        <li><a><i class="fa-solid fa-plus"></i></a></li>
                        <li><a class="language">EN</a></li>
                        <li><a>Login</a></li>
                        <li><a>Join TMDB</a></li>
                        <li><a><img src="assets/header/search-icon.svg" /></a></li>
                    </ul>
                </nav>
            </nav>
        </header>
        <main>
            <h1 class="main-title">Popular Movies</h1>
            <section>
                <div class="filters">
                    <div class="sort">
                        <div class="title">
                            <p>Sort</p>
                            <span>></span>
                        </div>
                        <div class="selection">
                            <p>Sort Results By</p>
                            <select name="movie-sort">
                                <option value="popularity.desc">Popularity Descending</option>
                                <option value="popularity.asc">Popularity Ascending</option>
                                <option value="vote_average.desc">Rating Descending</option>
                                <option value="vote_average.asc">Rating Ascending</option>
                                <option value="primary_release_date.desc">Release Date Descending</option>
                                <option value="primary_release_date.asc">Release Date Ascending</option>
                                <option value="original_title.asc">Title (A-Z)</option>
                                <option value="original_title.desc">Title (Z-A)</option>
                            </select>
                        </div>
                    </div>
                    <button disabled class="search-button">Search</button>
                    <button class="big-button">Search</button>
                </div>
                <div>
                    <div class="movie-cards"></div>
                    <button>Load more</button>
                </div>
            </section>
        </main>
    </body>
    <script src="main.js" type="module"></script>
</html>
